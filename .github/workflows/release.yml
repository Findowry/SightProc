name: Release AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-normal:
    name: Build SightProc AppImage (System-Qt / Full Theming)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            wget \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Qt 6.10
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure and build SightProc
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_SKIP_INSTALL_RPATH=ON
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Prepare System-Qt AppDir
        run: |
          cp AppDir/usr/share/applications/sightproc.desktop AppDir/SightProc.desktop
          cp AppDir/usr/share/icons/hicolor/scalable/apps/sightproc.svg AppDir/sightproc.svg
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/sightproc" "$@"
          EOF
          chmod +x AppDir/AppRun
          test -z "$(find AppDir \( -name 'libQt6*' -o -name 'qt.conf' \))"

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build SightProc-x86_64.AppImage
        env:
          ARCH: 'x86_64'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          ./appimagetool-x86_64.AppImage AppDir SightProc-x86_64.AppImage
          test -f SightProc-x86_64.AppImage
          ls -lh SightProc-x86_64.AppImage

      - name: Upload System-Qt AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: sightproc-appimage-normal
          path: SightProc-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1

  build-legacy:
    name: Build SightProc Legacy AppImage (Ubuntu 22.04 / Qt 6.9 / glibc 2.35)
    # GitHub started deprecating ubuntu-22.04 on 2026-09-17 (retires 2027-04-17).
    # Keeping it for glibc 2.35 legacy AppImage compatibility until ubuntu-22.04 retires.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            wget \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libwayland-dev

      - name: Install Qt 6.9
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Apply CI-only Qt 6.9 and legacy About patches
        run: |
          sed -i \
            -e '/beginFilterChange();/d' \
            -e 's/endFilterChange(QSortFilterProxyModel::Direction::Rows);/invalidateRowsFilter();/g' \
            src/models/ProcessFilterProxyModel.cpp \
            src/models/ServiceTableModel.cpp
          ! grep -nE 'beginFilterChange|endFilterChange' \
            src/models/ProcessFilterProxyModel.cpp \
            src/models/ServiceTableModel.cpp

          sed -i \
            -e 's|<h3>SightProc \([0-9][0-9.]*\)</h3>|<h3>SightProc \1 (Legacy)</h3>|' \
            -e 's|<p>Your sight into /proc\.</p>|<p>You are using a legacy version of SightProc that doesn'\''t offer proper customization. This version is patched for Qt 6.9 compatibility. This version offers glibc 2.35+ support.</p><p>Your sight into /proc.</p>|' \
            src/ui/MainWindow.cpp
          grep -q '<h3>SightProc [0-9][0-9.]* (Legacy)</h3>' src/ui/MainWindow.cpp
          grep -q "You are using a legacy version of SightProc that doesn't offer proper customization\. This version is patched for Qt 6\.9 compatibility\. This version offers glibc 2\.35+ support\." src/ui/MainWindow.cpp
          git diff --stat

      - name: Configure and build SightProc
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          EXTRA_QT_MODULES: 'svg;waylandcompositor'
          LDAI_OUTPUT: 'SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage'
          VERSION: ${{ github.ref_name }}
        run: |
          export QMAKE="${{ steps.install-qt.outputs.qt-root-dir }}/bin/qmake"
          if [ ! -x "$QMAKE" ]; then
            QMAKE="$(command -v qmake6 || command -v qmake)"
          fi
          QT_PLUGINS_DIR="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
          WAYLAND_PLUGINS=()
          for plugin in "$QT_PLUGINS_DIR"/platforms/libqwayland*.so; do
            if [ -f "$plugin" ]; then
              WAYLAND_PLUGINS+=("$(basename "$plugin")")
            fi
          done
          if [ "${#WAYLAND_PLUGINS[@]}" -gt 0 ]; then
            EXTRA_PLATFORM_PLUGINS="$(IFS=';'; echo "${WAYLAND_PLUGINS[*]}")"
            export EXTRA_PLATFORM_PLUGINS
          fi
          echo "Detected Wayland platform plugins: ${EXTRA_PLATFORM_PLUGINS:-<none>}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/sightproc \
            --desktop-file AppDir/usr/share/applications/sightproc.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/sightproc.svg \
            --plugin qt \
            --output appimage
          test -f SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage
          ls -lh SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage

      - name: Upload Legacy AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: sightproc-appimage-legacy
          path: SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build-normal, build-legacy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download built AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sightproc-appimage-*
          path: dist
          merge-multiple: true

      - name: Verify AppImage files
        run: |
          test -f dist/SightProc-x86_64.AppImage
          test -f dist/SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SightProc-x86_64.AppImage
            dist/SightProc-x86_64-glibc2.35-qt6.9-ubuntu22.04-legacy-nocustomizability.AppImage
